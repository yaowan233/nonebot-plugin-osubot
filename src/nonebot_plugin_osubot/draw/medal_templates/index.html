<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Torus;src:url('../template_assets/torus-regular.woff')}
@font-face{font-family:Torus;src:url('../template_assets/torus-semibold.woff');font-weight:800}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;background:transparent;font-family:Torus,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}

.card{position:relative;width:1280px;min-height:900px;padding-bottom:60px;overflow:hidden;background:#101722;color:#fff}

/* Header */
.head{position:relative;height:150px;padding:30px 48px;border-bottom:1px solid #ffffff12;background:linear-gradient(105deg,#1a2c3e 0%,#101722 70%)}
.me{display:flex;align-items:center;gap:18px}
.me .avatar{width:78px;height:78px;border-radius:50%;border:3px solid #f3b61f;object-fit:cover;background:#26323d}
.me h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.me .sub{color:#82929d;font-size:12px;font-weight:600;margin-top:6px}
.head-meta{position:absolute;right:48px;top:30px;text-align:right;color:#82929d;font-size:12px;line-height:1.9;font-weight:600}
.head-meta b{color:#62cddd;font-size:16px}

/* Medal grid — 5 per row */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 40px 0}
.m-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 8px 12px;background:#0b1925e8;border:1px solid #ffffff12;border-radius:10px;transition:background .2s}
.m-card:hover{background:#ffffff08}
.m-card img{width:72px;height:72px;object-fit:contain;image-rendering:-webkit-optimize-contrast}
.mname{width:100%;margin-top:8px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta{width:100%;margin-top:4px;color:#718794;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta .grp{color:#f3b61f}

/* Footer */
.foot{position:absolute;left:40px;right:40px;bottom:20px;display:flex;justify-content:space-between;color:#586b78;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>

<main class="card">
    <header class="head">
        <div class="me">
            <img class="avatar" src="{{ me_avatar }}" alt="">
            <div>
                <h1>{{ title }}</h1>
                <div class="sub">{{ subtitle }}</div>
            </div>
        </div>
        <div class="head-meta">
            <b>{{ start }}-{{ end }}</b> / {{ total }}<br>
            OSU! ACHIEVEMENTS
        </div>
    </header>

    <section class="grid">
        {% for ach in achievements %}
        <div class="m-card">
            <img src="{{ ach.icon }}" alt="">
            <div class="mname" title="{{ ach.name }}">{{ ach.name }}</div>
            <div class="mmeta"><span class="grp">{{ ach.grouping }}</span>{% if ach.achieved_at %}<br>{{ ach.achieved_at }}{% endif %}</div>
        </div>
        {% endfor %}
    </section>

    <footer class="foot">
        <span>OSUBOT ACHIEVEMENTS · /ma /ar</span>
        <span>{{ me_name }}</span>
    </footer>
</main>

</body>
</html>
