name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@master
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"
        version: 'latest'

    - name: Get Version
      id: version
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        TAG_NAME="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
        git check-ref-format "refs/tags/$TAG_NAME"
        echo "VERSION=$(uv version --short)" >> $GITHUB_OUTPUT
        echo "TAG_VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Check Version
      if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
      run: exit 1

    - name: Build
      run: uv build

    - name: Publish a Python distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Upload Release Asset
      run: gh release upload --clobber "$TAG_NAME" dist/*.tar.gz dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
